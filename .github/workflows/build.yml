name: Development build and contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.13'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
          setup-python: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/build/package" -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}"
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Windows desktop startup contract
        if: runner.os == 'Windows'
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
          QT_DEBUG_PLUGINS: '1'
        run: |
          build/Release/desktop_tests.exe -functions
          build/Release/desktop_tests.exe scrollingPastTileLimitKeepsTheVisibleViewportLoaded -v1
      - name: Contract and desktop tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: SQLite capture experiment
        run: python tests/sqlite_capture_experiment.py --output build/sqlite-capture-benchmark.json
      - name: Service and Python execution experiment
        env:
          PYTHONPATH: service
        run: python tests/service_execution_experiment.py --output build/service-execution-benchmark.json
      - name: Native representation experiment
        env:
          PYTHONPATH: service
        run: python tests/native_storage_experiment.py --output build/native-storage-benchmark.json
      - name: Formula-chain measurements
        env:
          PYTHONPATH: service
        run: python tests/benchmark.py --formula-only --output build/formula-benchmark.json
      - name: Qt scroll and input measurements
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            build/Release/desktop_benchmark.exe build/desktop-benchmark.json
          else
            build/desktop_benchmark build/desktop-benchmark.json
          fi
      - name: Record build and runtime baseline
        run: python tests/toolchain_report.py --build build --output build/toolchain-benchmark.json
      - name: Native platform acceptance at two scales
        shell: bash
        run: |
          unset QT_QPA_PLATFORM
          for scale in 1 2; do
            if [ "$RUNNER_OS" = "Windows" ]; then
              QT_SCALE_FACTOR=$scale build/Release/native_acceptance.exe build/native-acceptance-$scale.json
            elif [ "$RUNNER_OS" = "Linux" ]; then
              QT_SCALE_FACTOR=$scale xvfb-run -a build/native_acceptance build/native-acceptance-$scale.json
            else
              QT_SCALE_FACTOR=$scale build/native_acceptance build/native-acceptance-$scale.json
            fi
          done
      - name: Preserve platform benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: m1-measurements-${{ runner.os }}
          path: |
            build/*benchmark.json
            build/*-frozen-row.png
            build/native-acceptance-*.json
            build/native-acceptance-*.png
          if-no-files-found: error
      - name: Install smoke
        run: cmake --install build --config Release
      - name: Run installed application
        if: runner.os != 'Linux'
        run: python tests/package_smoke.py build/package
      - name: Run installed application under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/package_smoke.py build/package
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-${{ runner.os }}
          path: |
            build/Testing/Temporary/*.log
            build/build-toolchain.json
          if-no-files-found: ignore

  minimum-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Minimum Python contract suite
        env:
          PYTHONPATH: service
        run: python -m unittest discover -s tests -v
      - name: Record minimum runtime
        run: python tests/toolchain_report.py --runtime-only --output runtime-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: minimum-runtime-${{ runner.os }}
          path: runtime-baseline.json
          if-no-files-found: error
